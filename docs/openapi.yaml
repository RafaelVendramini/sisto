  /estudantes:
    get:
      tags: [Estudantes]
      summary: Listar estudantes
      operationId: listarEstudantes
      description: |
        Lista ordenada por nome completo e depois por id, opcionalmente de uma
        turma (turma atual do estudante). Turma inexistente no filtro devolve
        lista vazia.

        * **Gestão:** `EstudanteCompleto` (com `codigoEscolar` e tutor com
          `email` e `status`, para a Gestão ver tutor bloqueado/desativado —
          RN13).
        * **Demais perfis (RN20):** `EstudanteReduzido` — só `id`,
          `nomeCompleto`, `turma` e `tutor` (`{ id, nome }` ou `null`).

        Perfis: todos.
      parameters:
        - name: turmaId
          in: query
          required: false
          description: Turma atual do estudante. Inteiro positivo; vazio, repetido ou fora do formato responde 400.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: Lista de estudantes (formato conforme o perfil).
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/EstudanteCompleto'
                    - $ref: '#/components/schemas/EstudanteReduzido'
              examples:
                gestao:
                  summary: Consultado pela Gestão
                  value:
                    - id: 10
                      nomeCompleto: Aluno Fictício Dez
                      codigoEscolar: EXEMPLO-0010
                      turma:
                        id: 1
                        nome: 1º A
                        etapa: Ensino Médio
                        anoLetivo: 2026
                      tutor:
                        id: 3
                        nome: Tutora Fictícia Três
                        email: tutora.tres@escola.exemplo
                        status: ATIVO
                demaisPerfis:
                  summary: Consultado por outro perfil
                  value:
                    - id: 10
                      nomeCompleto: Aluno Fictício Dez
                      turma:
                        id: 1
                        nome: 1º A
                        etapa: Ensino Médio
                        anoLetivo: 2026
                      tutor:
                        id: 3
                        nome: Tutora Fictícia Três
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
    post:
      tags: [Estudantes]
      summary: Cadastrar estudante
      operationId: cadastrarEstudante
      description: |
        `turmaId` precisa existir (400). `tutorId`, se informado, precisa ser
        um usuário com perfil `TUTOR` e status `ATIVO` (RN13 — 400).
        `codigoEscolar` é opcional, único quando informado (409 — RN18),
        compara ignorando espaços nas pontas e diferenciando maiúsculas;
        vazio vira `null`. Nomes podem se repetir. Gera LogAuditoria
        "estudante criado".

        Perfis: GESTAO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstudanteEntrada'
            example:
              nomeCompleto: Aluno Fictício Dez
              codigoEscolar: EXEMPLO-0010
              turmaId: 1
              tutorId: 3
      responses:
        '201':
          description: Estudante cadastrado (formato completo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstudanteCompleto'
              example:
                id: 10
                nomeCompleto: Aluno Fictício Dez
                codigoEscolar: EXEMPLO-0010
                turma:
                  id: 1
                  nome: 1º A
                  etapa: Ensino Médio
                  anoLetivo: 2026
                tutor:
                  id: 3
                  nome: Tutora Fictícia Três
                  email: tutora.tres@escola.exemplo
                  status: ATIVO
        '400':
          description: Dados inválidos, turma inexistente ou tutor que não é Tutor ativo (RN13).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
