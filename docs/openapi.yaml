  schemas:
    Erro:
      type: object
      description: Formato único das respostas de erro.
      required: [erro]
      properties:
        erro:
          type: string
          description: Mensagem clara, em português, segura para exibir ao usuário.
        codigo:
          type: string
          description: |
            Código estável do erro (Issue #72). Enviado em todas as respostas
            409 e no 403 de troca de senha obrigatória pendente (RN10); ausente
            nos demais erros. O front-end identifica o caso pelo código, não
            pelo texto de `erro`. A mesma situação em recursos diferentes usa o
            mesmo código; os valores não mudam (renomear quebra o contrato).

            * `CONFLITO_CONCORRENTE` (409): a operação esbarrou em outra
              simultânea e a transação foi repetida sem sucesso; tentar de
              novo. Em POST/PUT de categorias, turmas e estudantes,
              `PUT /usuarios/{id}`, `PUT /usuarios/{id}/senha`,
              `PUT /conta/senha`, `POST /ocorrencias`, encaminhamentos,
              comunicações, providências e `PATCH /ocorrencias/{id}/status`.
            * `EMAIL_DUPLICADO` (409): e-mail já usado por outro usuário
              (`POST /usuarios`, `PUT /usuarios/{id}`).
            * `CATEGORIA_DUPLICADA` (409): nome de categoria já usado (RN18).
            * `TURMA_DUPLICADA` (409): trio nome, etapa e ano letivo já usado
              (RN18).
            * `CODIGO_ESCOLAR_DUPLICADO` (409): código escolar já usado por
              outro estudante (RN18).
            * `GESTAO_ATIVA_MINIMA` (409): a edição deixaria menos de dois
              usuários Gestão ativos (RN11).
            * `ALTERAR_PROPRIO_ACESSO` (409): a Gestão tentou bloquear,
              desativar ou alterar o perfil do próprio usuário (RN11).
            * `REDEFINIR_PROPRIA_SENHA` (409): `PUT /usuarios/{id}/senha` na
              própria conta (RF03); usar `PUT /conta/senha`.
            * `TUTOR_COM_TUTORADOS` (409): troca de perfil de um Tutor com
              estudantes vinculados (RN13).
            * `OCORRENCIA_ENCERRADA` (409): ocorrência encerrada não recebe
              encaminhamento, comunicação ou providência, nem é encerrada de
              novo (RN04, RN15, RN16).
            * `OCORRENCIA_ABERTA` (409): providência ou encerramento com a
              ocorrência ainda aberta (RN04).
            * `ENCERRAMENTO_SEM_PROVIDENCIA` (409): encerramento sem nenhuma
              providência registrada (RN04).
            * `TROCA_SENHA_OBRIGATORIA` (403): troca de senha obrigatória
              pendente; só `PUT /conta/senha` é liberada (RN10).
          enum:
            - CONFLITO_CONCORRENTE
            - EMAIL_DUPLICADO
            - CATEGORIA_DUPLICADA
            - TURMA_DUPLICADA
            - CODIGO_ESCOLAR_DUPLICADO
            - GESTAO_ATIVA_MINIMA
            - ALTERAR_PROPRIO_ACESSO
            - REDEFINIR_PROPRIA_SENHA
            - TUTOR_COM_TUTORADOS
            - OCORRENCIA_ENCERRADA
            - OCORRENCIA_ABERTA
            - ENCERRAMENTO_SEM_PROVIDENCIA
            - TROCA_SENHA_OBRIGATORIA
          example: TROCA_SENHA_OBRIGATORIA

    Perfil:
      type: string
      description: Perfil do usuário (valores técnicos da Seção 11).
      enum: [PROFESSOR, TUTOR, GESTAO, PEDAGOGICO, TECNICO_ADMINISTRATIVO]
    StatusUsuario:
      type: string
      enum: [ATIVO, BLOQUEADO, DESATIVADO]
    StatusOcorrencia:
      type: string
      description: Fluxo aberto → em acompanhamento → encerrado, sem retorno (RN04).
      enum: [ABERTO, EM_ACOMPANHAMENTO, ENCERRADO]
    DestinatarioPerfil:
      type: string
      description: Tipo de destinatário do encaminhamento (RN03).
      enum: [TUTOR, EQUIPE_PEDAGOGICA, GESTAO]
    Id:
      type: integer
      minimum: 1
      maximum: 2147483647
    DataHoraInformada:
      type: string
      format: date-time
      description: |
        ISO 8601 com fuso obrigatório (`Z` ou `±hh:mm`); minutos obrigatórios,
        segundos e fração opcionais. Até 5 minutos à frente do servidor
        (RN17); anos 0001 a 9999 em UTC.
      example: '2026-10-20T14:30:00-03:00'
    DataHoraResposta:
      type: string
      format: date-time
      description: Data/hora em UTC, com milissegundos.
      example: '2026-10-20T17:30:00.000Z'
    Senha:
      type: string
      minLength: 8
      description: Mínimo de 8 caracteres (RN10) e máximo de 72 bytes em UTF-8 (letras acentuadas contam 2). Espaços não são retirados.

    LoginEntrada:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          description: Texto não vazio; comparado sem espaços nas pontas e em minúsculas.
        senha:
          type: string
          description: Texto não vazio (a política da RN10 não é aplicada no login).
    LoginResposta:
      type: object
      required: [token, usuario, trocaSenhaObrigatoria]
      properties:
        token:
          type: string
          description: JWT HS256 com validade de 8 horas.
        usuario:
          type: object
          required: [id, nome, perfil]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            nome:
              type: string
            perfil:
              $ref: '#/components/schemas/Perfil'
        trocaSenhaObrigatoria:
          type: boolean
          description: Quando `true`, o usuário precisa trocar a senha temporária antes de usar as demais rotas (RN10).

    TrocaSenhaEntrada:
      type: object
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual:
          type: string
        novaSenha:
          $ref: '#/components/schemas/Senha'
    RedefinicaoSenhaEntrada:
      type: object
      required: [novaSenha]
      properties:
        novaSenha:
          $ref: '#/components/schemas/Senha'

    UsuarioCompleto:
      type: object
      description: Formato visto pela Gestão (nunca inclui senha nem hash).
      required: [id, nome, email, perfil, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        email:
          type: string
        perfil:
          $ref: '#/components/schemas/Perfil'
        status:
          $ref: '#/components/schemas/StatusUsuario'
    UsuarioReduzido:
      type: object
      description: Formato visto por quem não é Gestão (RN20).
      required: [id, nome, perfil]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        perfil:
          type: string
          enum: [TUTOR, PEDAGOGICO, GESTAO]
    UsuarioCadastroEntrada:
      type: object
      required: [nome, email, perfil, senha]
      properties:
        nome:
          type: string
          maxLength: 150
        email:
          type: string
          maxLength: 254
          description: Formato simples (parte local, "@", domínio com ponto); único.
        perfil:
          $ref: '#/components/schemas/Perfil'
        senha:
          $ref: '#/components/schemas/Senha'
    UsuarioEdicaoEntrada:
      type: object
      description: Ao menos um dos campos deve ser enviado.
      minProperties: 1
      properties:
        nome:
          type: string
          maxLength: 150
        email:
          type: string
          maxLength: 254
        perfil:
          $ref: '#/components/schemas/Perfil'
        status:
          $ref: '#/components/schemas/StatusUsuario'
    ReferenciaUsuario:
      type: object
      required: [id, nome]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string

    Turma:
      type: object
      required: [id, nome, etapa, anoLetivo]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        etapa:
          type: string
        anoLetivo:
          type: integer
    TurmaEntrada:
      type: object
      required: [nome, etapa, anoLetivo]
      properties:
        nome:
          type: string
          maxLength: 150
        etapa:
          type: string
          maxLength: 150
          description: Texto livre.
        anoLetivo:
          type: integer
          minimum: 1000
          maximum: 9999
          description: Inteiro de 4 dígitos enviado como número.

    TutorCompleto:
      type: object
      description: Tutor do estudante como a Gestão vê (RN13).
      required: [id, nome, email, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        email:
          type: string
        status:
          $ref: '#/components/schemas/StatusUsuario'
    EstudanteCompleto:
      type: object
      required: [id, nomeCompleto, codigoEscolar, turma, tutor]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nomeCompleto:
          type: string
        codigoEscolar:
          type: string
          nullable: true
        turma:
          $ref: '#/components/schemas/Turma'
        tutor:
          type: object
          allOf:
            - $ref: '#/components/schemas/TutorCompleto'
          nullable: true
    EstudanteReduzido:
      type: object
