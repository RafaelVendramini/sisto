openapi: 3.0.3
info:
  title: Sisto — API de gestão de ocorrências escolares
  version: "1.8"
  description: |
    Documentação da API REST (JSON) do Sisto, fiel à Seção 12 do SSD 1.8
    (`docs/SSD.md`) e ao código em `src/backend/src`. Este arquivo é a única
    documentação da API: não há Swagger UI exposta (SSD 1.8, Seção 10).

    **Autenticação.** Todas as rotas, exceto `/auth/*`, exigem o cabeçalho
    `Authorization: Bearer <token>`, com o JWT (HS256, validade de 8 horas,
    sem refresh — RNF03) devolvido pelo `POST /auth/login`. A cada requisição
    a API confere no banco se o usuário está `ATIVO` (RN09) e se o token foi
    emitido depois da última troca de senha (RN12); caso contrário, responde
    **401** com `WWW-Authenticate: Bearer` e a mesma mensagem genérica. Não há
    endpoint de logout: o front-end descarta o token (RF02).

    **Troca de senha obrigatória (RN10).** Enquanto o usuário tiver uma senha
    temporária, todas as rotas protegidas respondem **403**, exceto
    `PUT /conta/senha`. Esse 403 traz `codigo: "TROCA_SENHA_OBRIGATORIA"`
    (Issue #72), para o front-end distinguir o caso do 403 de perfil sem
    permissão.

    **Permissões.** Cada operação indica os perfis permitidos (matriz da
    Seção 4 do SSD). Perfil sem permissão recebe **403**
    (`Acesso não permitido para o seu perfil.`). A visibilidade das
    ocorrências segue a RN19: ocorrência fora da visibilidade do usuário é
    tratada como inexistente (**404**). Dados reduzidos para quem não é Gestão
    seguem a RN20.

    **Convenções de corpo.**
    * Os corpos JSON usam camelCase; o banco usa snake_case (Seção 11).
    * Identificadores e números chegam como número JSON; texto (ex.: `"3"`) é
      recusado com **400**.
    * Campos fora do contrato são ignorados (ex.: `status` ou
      `profissionalResponsavelId` no registro da ocorrência).
    * Textos são gravados sem os espaços das pontas (normalização NFC); o
      tamanho é medido depois disso, em unidades UTF-16. Texto opcional vazio
      ou só com espaços é gravado como `null`. A senha não tem os espaços
      retirados.
    * Nos textos de ocorrência, encaminhamento, comunicação e providência, o
      caractere nulo (U+0000) é recusado com **400**.
    * `dataHora` informada (ocorrência e comunicação — RN17) segue ISO 8601
      com fuso obrigatório (`Z` ou `±hh:mm`, ex.: `2026-10-20T14:30:00-03:00`),
      anos 0001 a 9999 em UTC, e aceita no máximo 5 minutos à frente do
      relógio do servidor. Datas devolvidas pela API estão em UTC
      (ex.: `2026-10-20T17:30:00.000Z`); a exibição é no horário de São Paulo.
    * Parâmetros de período na query (`dataInicio`, `dataFim`) usam
      `AAAA-MM-DD` e valem como dias inteiros no fuso `America/Sao_Paulo`,
      com as duas pontas incluídas.
    * Ids de URL e de query aceitam apenas inteiro positivo em notação decimal
      simples (sem sinal, zeros à esquerda ou espaços), até 2147483647; fora
      disso, **400**. Parâmetro de query repetido (ex.: `?turmaId=1&turmaId=2`)
      também é **400**.

    **Erros.** Toda resposta de erro tem o formato `{ "erro": "mensagem" }`
    (esquema `Erro`). Todas as respostas **409** e o **403** de troca de
    senha obrigatória (RN10) trazem também o campo `codigo`, um código
    estável (Issue #72) que o front-end usa para identificar o caso sem
    depender do texto da mensagem; os valores e o significado de cada um
    estão no esquema `Erro`. As demais respostas de erro trazem só `erro`.
    Status HTTP usados:
    * **400** entrada inválida, inclusive referência inexistente no corpo
      (turma, estudante, categoria ou usuário) e JSON malformado
      (`JSON inválido no corpo da requisição`);
    * **401** não autenticado;
    * **403** perfil sem permissão (inclusive RN22) ou troca de senha pendente;
    * **404** recurso da URL inexistente ou fora da visibilidade (RN19), e rota
      inexistente (`Rota não encontrada`);
    * **409** duplicidade (RN18), operação recusada pelo estado da ocorrência
      ou pelas regras de usuários e tutoria (RN04, RN11, RN13, RN15, RN16) e
      conflito concorrente (transação serializável repetida sem sucesso —
      mensagem para tentar de novo);
    * **429** limite de tentativas do login ou da troca de senha excedido;
    * **500** `{ "erro": "Erro interno do servidor" }`, sem detalhes.

    Nota técnica: o corpo JSON é lido pelo `express.json()` com o limite
    padrão de 100 kB; acima dele a resposta é 413, no mesmo formato `Erro`.

    **Exemplos.** Todos os nomes, e-mails e códigos dos exemplos são
    fictícios (RN05 / LGPD).
  contact:
    name: Equipe Sisto (LTD)
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local (porta padrão do back-end, variável PORT)
tags:
  - name: Autenticação
  - name: Conta
  - name: Usuários
  - name: Turmas
  - name: Estudantes
  - name: Categorias
  - name: Ocorrências
  - name: Relatórios
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autenticar usuário
      operationId: login
      security: []
      description: |
        Rota pública (sem JWT). Recebe e-mail e senha e devolve o JWT
        (validade de 8 horas, sem refresh — RNF03). Somente usuários `ATIVO`
        autenticam (RN09). O e-mail é comparado sem espaços nas pontas e em
        minúsculas. A mesma mensagem genérica é usada para e-mail inexistente,
        senha incorreta e usuário bloqueado ou desativado (RNF06).

        O token é emitido mesmo com a troca de senha pendente: é ele que
        autoriza o `PUT /conta/senha`. Quando `trocaSenhaObrigatoria` for
        `true`, o front-end leva o usuário direto à troca de senha (RN10).

        **Limite de tentativas (SSD 1.8, Issue #90):** até 5 tentativas com
        falha (respostas 401) em 15 minutos, contadas por IP + e-mail
        informado. Acima disso, **429** com `Retry-After`. O 400 de corpo
        incompleto e os logins bem-sucedidos não contam. O limite não altera o
        status da conta (RN07). O contador fica em memória e zera quando a API
        reinicia.

        Perfis: público.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
            example:
              email: gestao.um@escola.exemplo
              senha: SenhaFicticia123
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResposta'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.exemplo.assinatura
                usuario:
                  id: 1
                  nome: Gestora Fictícia Um
                  perfil: GESTAO
                trocaSenhaObrigatoria: false
        '400':
          description: E-mail ou senha ausentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: Informe email e senha (texto não vazio).
        '401':
          description: |
            Credenciais inválidas ou usuário sem acesso (mensagem única).
            Diferente das rotas protegidas, esta resposta não traz
            `WWW-Authenticate`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: E-mail ou senha inválidos.
        '429':
          $ref: '#/components/responses/MuitasTentativas'

  /auth/recuperar-senha:
    post:
      tags: [Autenticação]
      summary: Reservado para etapa futura — não implementado
      operationId: recuperarSenha
      deprecated: true
      security: []
      description: |
        **Reservado — fora do MVP atual.** Redefinição de senha por link
        enviado ao e-mail, dependente do Spike #19 e de nova decisão (SSD 1.8,
        Seção 12). A rota não existe no código: qualquer chamada responde 404
        (`Rota não encontrada`). No MVP, a recuperação de acesso é feita pela
        Gestão (`PUT /usuarios/{id}/senha`).
      responses:
        '404':
          description: Rota não implementada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: Rota não encontrada

  /conta/senha:
    put:
      tags: [Conta]
      summary: Trocar a própria senha
      operationId: trocarPropriaSenha
      description: |
        O usuário logado troca a própria senha informando a atual (RF03).
        Única rota liberada enquanto a troca de senha obrigatória estiver
        pendente (RN10). A nova senha segue a política da RN10 (mínimo de 8
        caracteres, máximo de 72 bytes em UTF-8) e não pode ser igual à atual.
        Senha atual incorreta ou nova igual à atual respondem **400** (não
        401, que o front-end trata como sessão expirada).

        Após a troca, `troca_senha_obrigatoria` volta a `false`, e todos os
        tokens emitidos antes, inclusive o usado aqui, deixam de valer (RN12):
        o usuário precisa fazer login de novo. Não devolve token novo. A troca
        é registrada no LogAuditoria, sem a senha (RNF04).

        **Limite de tentativas (SSD 1.8, Issue #90):** até 5 tentativas com
        falha (respostas 400) em 15 minutos, contadas por IP + usuário logado.
        Acima disso, **429** com `Retry-After`. O limite não altera o status
        da conta (RN07).

        Perfis: todos (PROFESSOR, TUTOR, GESTAO, PEDAGOGICO,
        TECNICO_ADMINISTRATIVO).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocaSenhaEntrada'
            example:
              senhaAtual: SenhaTemporaria1
              novaSenha: NovaSenhaFicticia2
      responses:
        '204':
          description: Senha trocada. Sem corpo; é preciso entrar de novo.
        '400':
          description: Corpo inválido, senha fora da política, senha atual incorreta ou nova igual à atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                senhaAtualIncorreta:
                  value:
                    erro: A senha atual está incorreta.
                novaIgualAtual:
                  value:
                    erro: A nova senha deve ser diferente da senha atual.
                politica:
                  value:
                    erro: A senha deve ter no mínimo 8 caracteres.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          description: Conflito concorrente com outra troca de senha do mesmo usuário (`CONFLITO_CONCORRENTE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: A senha deste usuário foi alterada por outra operação ao mesmo tempo. Tente novamente.
                codigo: CONFLITO_CONCORRENTE
        '429':
          $ref: '#/components/responses/MuitasTentativas'

  /usuarios:
    get:
      tags: [Usuários]
      summary: Listar usuários
      operationId: listarUsuarios
      description: |
        Lista ordenada por nome e depois por id (RN20, Issue #44).

        * **Gestão:** lista completa (`id`, `nome`, `email`, `perfil`,
          `status`) de todos os usuários, de qualquer status. O filtro
          `?perfil=` é ignorado.
        * **Demais perfis:** apenas `id`, `nome` e `perfil` dos usuários
          `ATIVO` com perfil `TUTOR`, `PEDAGOGICO` ou `GESTAO` (possíveis
          destinatários de encaminhamento e responsáveis pelo acompanhamento).
          Aceita `?perfil=` com um desses três valores.

        Perfis: todos.
      parameters:
        - name: perfil
          in: query
          required: false
          description: |
            Só para quem não é Gestão. Valor exato do enum; fora de
            `TUTOR`, `PEDAGOGICO`, `GESTAO`, vazio ou repetido responde 400.
          schema:
            type: string
            enum: [TUTOR, PEDAGOGICO, GESTAO]
      responses:
        '200':
          description: |
            Lista de usuários. Para a Gestão, itens `UsuarioCompleto`; para os
            demais perfis, itens `UsuarioReduzido`.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/UsuarioCompleto'
                    - $ref: '#/components/schemas/UsuarioReduzido'
              examples:
                gestao:
                  summary: Consultado pela Gestão
                  value:
                    - id: 1
                      nome: Gestora Fictícia Um
                      email: gestao.um@escola.exemplo
                      perfil: GESTAO
                      status: ATIVO
                    - id: 4
                      nome: Tutor Fictício Quatro
                      email: tutor.quatro@escola.exemplo
                      perfil: TUTOR
                      status: BLOQUEADO
                demaisPerfis:
                  summary: Consultado por outro perfil
                  value:
                    - id: 1
                      nome: Gestora Fictícia Um
                      perfil: GESTAO
                    - id: 3
                      nome: Tutora Fictícia Três
                      perfil: TUTOR
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
    post:
      tags: [Usuários]
      summary: Cadastrar usuário
      operationId: cadastrarUsuario
      description: |
        Cadastra um usuário com status `ATIVO` e a senha temporária definida
        pela Gestão (RF01, RN10). O usuário é criado com troca de senha
        obrigatória no primeiro login. O e-mail é gravado sem espaços nas
        pontas e em minúsculas e precisa ser único. Outros campos do corpo
        (ex.: `status`, `id`) são ignorados. Gera LogAuditoria
        "usuário criado".

        Perfis: GESTAO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCadastroEntrada'
            example:
              nome: Professora Fictícia Cinco
              email: professora.cinco@escola.exemplo
              perfil: PROFESSOR
              senha: SenhaTemporaria1
      responses:
        '201':
          description: Usuário cadastrado (sem senha nem hash).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioCompleto'
              example:
                id: 5
                nome: Professora Fictícia Cinco
                email: professora.cinco@escola.exemplo
                perfil: PROFESSOR
                status: ATIVO
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '409':
          description: E-mail já cadastrado (`EMAIL_DUPLICADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: Já existe um usuário cadastrado com este e-mail.
                codigo: EMAIL_DUPLICADO

  /usuarios/{id}:
    put:
      tags: [Usuários]
      summary: Editar usuário (inclui bloqueio, desativação e reativação)
      operationId: editarUsuario
      description: |
        Edição parcial: cada campo é opcional, mas ao menos um de `nome`,
        `email`, `perfil` e `status` deve vir; os presentes seguem as regras
        do cadastro. Outros campos são ignorados (a senha não é alterada
        aqui). Status `ATIVO`, `BLOQUEADO` ou `DESATIVADO` (RF04, RN07);
        reativar é voltar a `ATIVO`. O bloqueio ou a desativação corta o
        acesso na requisição seguinte (RN09). Gera LogAuditoria
        "usuário editado".

        Respostas **409** (com o `codigo` de cada caso):
        * a Gestão tenta bloquear, desativar ou alterar o próprio perfil
          (RN11) — `ALTERAR_PROPRIO_ACESSO`; editar o próprio nome/e-mail é
          permitido;
        * a edição deixaria menos de dois usuários Gestão ativos (RN11) —
          `GESTAO_ATIVA_MINIMA`;
        * troca de perfil de um Tutor com estudantes vinculados (RN13) —
          `TUTOR_COM_TUTORADOS`;
        * e-mail já usado por outro usuário — `EMAIL_DUPLICADO`;
        * conflito concorrente — `CONFLITO_CONCORRENTE`.

        Perfis: GESTAO.
      parameters:
        - $ref: '#/components/parameters/IdUsuario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioEdicaoEntrada'
            example:
              status: BLOQUEADO
      responses:
        '200':
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioCompleto'
              example:
                id: 5
                nome: Professora Fictícia Cinco
                email: professora.cinco@escola.exemplo
                perfil: PROFESSOR
                status: BLOQUEADO
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: Usuário não encontrado.
        '409':
          description: |
            Recusado pelas regras RN11/RN13 (`ALTERAR_PROPRIO_ACESSO`,
            `GESTAO_ATIVA_MINIMA`, `TUTOR_COM_TUTORADOS`), e-mail duplicado
            (`EMAIL_DUPLICADO`) ou conflito concorrente (`CONFLITO_CONCORRENTE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                proprioAcesso:
                  value:
                    erro: Você não pode bloquear, desativar ou alterar o perfil do seu próprio usuário.
                    codigo: ALTERAR_PROPRIO_ACESSO
                minimoGestoes:
                  value:
                    erro: O sistema precisa de ao menos dois usuários Gestão ativos. Cadastre ou reative outro usuário Gestão antes de bloquear, desativar ou alterar o perfil deste.
                    codigo: GESTAO_ATIVA_MINIMA
                tutorComTutorados:
                  value:
                    erro: Este usuário Tutor tem estudantes vinculados. Desvincule os estudantes (ou troque o tutor deles) antes de alterar o perfil.
                    codigo: TUTOR_COM_TUTORADOS
                emailDuplicado:
                  value:
                    erro: Já existe um usuário cadastrado com este e-mail.
                    codigo: EMAIL_DUPLICADO
                concorrente:
                  value:
                    erro: O usuário foi alterado por outra operação ao mesmo tempo. Tente novamente.
                    codigo: CONFLITO_CONCORRENTE

  /usuarios/{id}/senha:
    put:
      tags: [Usuários]
      summary: Redefinir a senha de outro usuário
      operationId: redefinirSenhaUsuario
      description: |
        A Gestão define uma nova senha temporária para outro usuário (RF03,
        RN10). Depois dela, o usuário é obrigado a trocar a senha no próximo
        login, e todos os tokens anteriores deixam de valer (RN12). A regra de
        nova senha diferente da atual não se aplica aqui. É permitida para
        usuário bloqueado ou desativado, que continua sem acesso até ser
        reativado (RN09). Registrada no LogAuditoria, sem a senha.

        **409** quando a Gestão tenta redefinir a própria senha por este
        caminho (ela usa `PUT /conta/senha`) — `REDEFINIR_PROPRIA_SENHA` — e
        em conflito concorrente — `CONFLITO_CONCORRENTE`.

        Perfis: GESTAO.
      parameters:
        - $ref: '#/components/parameters/IdUsuario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinicaoSenhaEntrada'
            example:
              novaSenha: SenhaTemporaria9
      responses:
        '204':
          description: Senha redefinida. Sem corpo.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: Usuário não encontrado.
        '409':
          description: Redefinição da própria senha (`REDEFINIR_PROPRIA_SENHA`) ou conflito concorrente (`CONFLITO_CONCORRENTE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                propriaSenha:
                  value:
                    erro: Você não pode redefinir a sua própria senha por aqui. Use a opção "Alterar minha senha".
                    codigo: REDEFINIR_PROPRIA_SENHA
                concorrente:
                  value:
                    erro: A senha deste usuário foi alterada por outra operação ao mesmo tempo. Tente novamente.
                    codigo: CONFLITO_CONCORRENTE

  /turmas:
    get:
      tags: [Turmas]
      summary: Listar turmas
      operationId: listarTurmas
      description: |
        Todas as turmas, do ano letivo mais recente para o mais antigo, depois
        por etapa, nome e id. Mesma resposta para todos os perfis (RN20).

        Perfis: todos.
      responses:
        '200':
          description: Lista de turmas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turma'
              example:
                - id: 1
                  nome: 1º A
                  etapa: Ensino Médio
                  anoLetivo: 2026
                - id: 2
                  nome: 9º B
                  etapa: Ensino Fundamental II
                  anoLetivo: 2026
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
    post:
      tags: [Turmas]
      summary: Cadastrar turma
      operationId: cadastrarTurma
      description: |
        O trio (nome, etapa, ano letivo) é único; a comparação ignora
        maiúsculas/minúsculas e espaços nas pontas (RN18). A mesma turma em
        outro ano letivo é aceita. Gera LogAuditoria "turma criada".

        Perfis: GESTAO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurmaEntrada'
            example:
              nome: 1º A
              etapa: Ensino Médio
              anoLetivo: 2026
      responses:
        '201':
          description: Turma cadastrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turma'
              example:
                id: 1
                nome: 1º A
                etapa: Ensino Médio
                anoLetivo: 2026
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '409':
          $ref: '#/components/responses/ConflitoTurma'

  /turmas/{id}:
    put:
      tags: [Turmas]
      summary: Editar turma
      operationId: editarTurma
      description: |
        Os três campos são obrigatórios também na edição. Manter o próprio
        trio (inclusive com outra caixa) não é duplicidade. A edição não muda
        as ocorrências já registradas (RN14). Não há exclusão (RN21). Gera
