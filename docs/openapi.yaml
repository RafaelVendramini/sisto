      required: [id, destinatario, meio, descricao, dataHora, registradoPor]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        destinatario:
          type: string
        meio:
          type: string
        descricao:
          type: string
        dataHora:
          allOf:
            - $ref: '#/components/schemas/DataHoraResposta'
