          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: Rota não encontrada

  /ocorrencias/{id}/encaminhamentos:
    post:
      tags: [Ocorrências]
      summary: Registrar encaminhamento
      operationId: registrarEncaminhamento
      description: |
        Encaminha uma ocorrência já registrada (UC02, RF08), com as regras de
        destinatário da RN03 (iguais às do registro) e de status e responsável
        da RN15:

        * `ABERTO`: exige `responsavelAcompanhamentoId` (usuário ativo com
          perfil `TUTOR`, `PEDAGOGICO` ou `GESTAO`) e muda o status para
          `EM_ACOMPANHAMENTO`;
        * `EM_ACOMPANHAMENTO`: o status não muda e a troca do responsável é
          opcional; informar o responsável atual não é troca;
        * `ENCERRADO`: 409.

        Encaminhar de novo a um destinatário que já recebeu a ocorrência é
        permitido. Histórico (RN08): "encaminhamento registrado" e, quando
        houver, "status alterado" e "responsável pelo acompanhamento
        definido/alterado". LogAuditoria "encaminhamento registrado".

        Perfis: GESTAO, PEDAGOGICO.
      parameters:
        - $ref: '#/components/parameters/IdOcorrencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncaminhamentoEntrada'
            example:
              destinatarioPerfil: TUTOR
              destinatarioUsuarioId: 3
              observacao: Conversar com as famílias dos estudantes.
              responsavelAcompanhamentoId: 3
      responses:
        '201':
          $ref: '#/components/responses/DetalheOcorrencia'
        '400':
          description: Corpo inválido, responsável obrigatório ausente ou inválido, ou destinatário inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                responsavelObrigatorio:
                  value:
                    erro: Ocorrência com status aberto exige responsavelAcompanhamentoId (responsável pelo acompanhamento).
                responsavelInvalido:
                  value:
                    erro: O responsável pelo acompanhamento precisa ser um usuário com perfil Tutor, Pedagógico ou Gestão e status ativo.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/OcorrenciaNaoEncontrada'
        '409':
          description: Ocorrência encerrada (`OCORRENCIA_ENCERRADA`) ou conflito concorrente (`CONFLITO_CONCORRENTE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                encerrada:
                  value:
                    erro: Ocorrência encerrada não recebe encaminhamentos.
                    codigo: OCORRENCIA_ENCERRADA
                concorrente:
                  value:
                    erro: Não foi possível registrar o encaminhamento por causa de outra operação ao mesmo tempo. Tente novamente.
                    codigo: CONFLITO_CONCORRENTE

  /ocorrencias/{id}/comunicacoes:
    post:
      tags: [Ocorrências]
      summary: Registrar comunicação
      operationId: registrarComunicacao
      description: |
        Registra um contato feito **fora** do sistema (família, rede de
        proteção etc.); o sistema não envia notificações (RN16, Seção 5).
        Todos os campos são obrigatórios; destinatário e meio são texto livre.
        `dataHora` é o momento do contato (RN17). Ocorrência `ENCERRADO`
        responde 409; em `ABERTO` e `EM_ACOMPANHAMENTO` o status não muda.
        Histórico "comunicação registrada", sem o conteúdo (RN08).
        LogAuditoria "comunicação registrada".

        Perfis: TUTOR (apenas nas ocorrências que pode visualizar — RN19;
        fora delas, 404), GESTAO, PEDAGOGICO.
      parameters:
        - $ref: '#/components/parameters/IdOcorrencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComunicacaoEntrada'
            example:
              destinatario: Responsável pelo estudante
              meio: Telefone
              descricao: Responsável informado sobre o ocorrido e convidado para reunião.
              dataHora: '2026-10-21T09:00:00-03:00'
      responses:
        '201':
          $ref: '#/components/responses/DetalheOcorrencia'
        '400':
          description: Corpo inválido ou data futura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                dataFutura:
                  value:
                    erro: A data e hora da comunicação não pode estar no futuro.
                meio:
                  value:
                    erro: Informe meio (texto não vazio).
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/OcorrenciaNaoEncontrada'
        '409':
          description: Ocorrência encerrada (`OCORRENCIA_ENCERRADA`) ou conflito concorrente (`CONFLITO_CONCORRENTE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                encerrada:
                  value:
                    erro: Ocorrência encerrada não recebe comunicações.
                    codigo: OCORRENCIA_ENCERRADA
                concorrente:
                  value:
                    erro: Não foi possível registrar a comunicação por causa de outra operação ao mesmo tempo. Tente novamente.
                    codigo: CONFLITO_CONCORRENTE

  /ocorrencias/{id}/providencias:
    post:
      tags: [Ocorrências]
      summary: Registrar providência adotada
      operationId: registrarProvidencia
      description: |
        Registra uma providência adotada durante o acompanhamento (UC04). Só
        com a ocorrência em `EM_ACOMPANHAMENTO`; em `ABERTO` ou `ENCERRADO`,
        409 (RN04). Não muda o status. A data/hora é o momento do registro,
        preenchida pelo sistema (RN17). Histórico "providência registrada",
        sem o conteúdo (RN08). LogAuditoria "providência registrada".

        Ordem dos erros: sem token → 401; troca de senha pendente → 403;
        Professor e Técnico-administrativo → 403 na rota, antes de validar.
        Para os demais: 400 (id/corpo) → 404 (inexistente ou fora da
        visibilidade — RN19) → 403 (Tutor que não é o responsável) → 409.

        Perfis (RN22): GESTAO, PEDAGOGICO e o usuário que é o responsável pelo
        acompanhamento. Na rota entram GESTAO, PEDAGOGICO e TUTOR; o Tutor que
        vê a ocorrência mas não é o responsável recebe 403. PROFESSOR e
        TECNICO_ADMINISTRATIVO recebem 403.
      parameters:
        - $ref: '#/components/parameters/IdOcorrencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvidenciaEntrada'
            example:
              descricao: Reunião com os responsáveis e acordo de convivência registrado.
      responses:
        '201':
          $ref: '#/components/responses/DetalheOcorrencia'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/OcorrenciaNaoEncontrada'
        '409':
          description: |
            Status diferente de em acompanhamento (`OCORRENCIA_ABERTA` ou
            `OCORRENCIA_ENCERRADA`) ou conflito concorrente
            (`CONFLITO_CONCORRENTE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                aberta:
                  value:
                    erro: A providência só pode ser registrada com a ocorrência em acompanhamento. Esta ocorrência ainda está aberta.
                    codigo: OCORRENCIA_ABERTA
                encerrada:
                  value:
                    erro: Ocorrência encerrada não recebe providências.
                    codigo: OCORRENCIA_ENCERRADA
                concorrente:
                  value:
                    erro: Não foi possível registrar a providência por causa de outra operação ao mesmo tempo. Tente novamente.
                    codigo: CONFLITO_CONCORRENTE

  /ocorrencias/{id}/status:
    patch:
      tags: [Ocorrências]
      summary: Encerrar a ocorrência
      operationId: encerrarOcorrencia
      description: |
        Aceita somente `{ "status": "ENCERRADO" }`, sem justificativa (RN04).
        Valor ausente ou fora do enum → 400; `ABERTO` ou `EM_ACOMPANHAMENTO`
        → 400 (a passagem para em acompanhamento é feita só pelo
        encaminhamento — RN15). Só encerra a partir de `EM_ACOMPANHAMENTO` e
        com ao menos uma providência registrada; caso contrário, 409. Não há
        reabertura. `dataEncerramento` é preenchida com o momento do registro
        (RN17). Histórico "status alterado" ("De em acompanhamento para
        encerrado"). LogAuditoria "ocorrência encerrada".

        Ordem dos erros: sem token → 401; troca de senha pendente → 403;
        Professor e Técnico-administrativo → 403 na rota, antes de validar.
        Para os demais: 400 (id/corpo) → 404 (RN19) → 403 (Tutor que não é o
        responsável) → 409.

        Perfis (RN22): GESTAO, PEDAGOGICO e o responsável pelo acompanhamento
        (Tutor não responsável, PROFESSOR e TECNICO_ADMINISTRATIVO recebem
        403).
      parameters:
        - $ref: '#/components/parameters/IdOcorrencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoStatusEntrada'
            example:
              status: ENCERRADO
      responses:
        '200':
          $ref: '#/components/responses/DetalheOcorrencia'
        '400':
          description: Corpo inválido ou status diferente de ENCERRADO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                statusInvalido:
                  value:
                    erro: Informe status com o valor ENCERRADO.
                somenteEncerrado:
                  value:
                    erro: Só é possível alterar o status para encerrado.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/OcorrenciaNaoEncontrada'
        '409':
          description: |
            Ocorrência aberta (`OCORRENCIA_ABERTA`), já encerrada
            (`OCORRENCIA_ENCERRADA`), sem providência
            (`ENCERRAMENTO_SEM_PROVIDENCIA`) ou conflito concorrente
            (`CONFLITO_CONCORRENTE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                aberta:
                  value:
                    erro: A ocorrência só pode ser encerrada depois de entrar em acompanhamento. Esta ocorrência ainda está aberta.
                    codigo: OCORRENCIA_ABERTA
                jaEncerrada:
                  value:
                    erro: Esta ocorrência já está encerrada e não pode ser reaberta.
                    codigo: OCORRENCIA_ENCERRADA
                semProvidencia:
                  value:
                    erro: Registre ao menos uma providência adotada antes de encerrar a ocorrência.
                    codigo: ENCERRAMENTO_SEM_PROVIDENCIA
                concorrente:
                  value:
                    erro: Não foi possível encerrar a ocorrência por causa de outra operação ao mesmo tempo. Tente novamente.
                    codigo: CONFLITO_CONCORRENTE

  /ocorrencias/{id}/historico:
    get:
      tags: [Ocorrências]
      summary: Consultar o histórico da ocorrência
      operationId: historicoOcorrencia
      description: |
        Registros do histórico (RF12, RN08), do mais antigo para o mais novo
        (data/hora e, no empate, id), sem paginação. A ação e a descrição são
        textos fixos, sem dados pessoais nem conteúdo de comunicações ou
        providências; do usuário vêm só `id` e `nome`.

        Ações possíveis: "ocorrência registrada", "encaminhamento registrado",
        "status alterado", "responsável pelo acompanhamento definido",
        "responsável pelo acompanhamento alterado", "comunicação registrada",
        "providência registrada".

        Perfis: todos (quem vê a ocorrência — RN19; fora dela, 404).
      parameters:
        - $ref: '#/components/parameters/IdOcorrencia'
      responses:
        '200':
          description: Histórico da ocorrência.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroHistorico'
              example:
                - id: 100
                  acao: ocorrência registrada
                  descricao: null
                  dataHora: '2026-10-20T17:40:00.000Z'
                  usuario:
                    id: 5
                    nome: Professora Fictícia Cinco
                - id: 101
                  acao: encaminhamento registrado
                  descricao: 'Destinatário: tutor'
                  dataHora: '2026-10-20T17:40:00.000Z'
                  usuario:
                    id: 5
                    nome: Professora Fictícia Cinco
                - id: 105
                  acao: status alterado
                  descricao: De aberto para em acompanhamento
                  dataHora: '2026-10-21T11:00:00.000Z'
                  usuario:
                    id: 1
                    nome: Gestora Fictícia Um
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/OcorrenciaNaoEncontrada'

  /relatorios:
    get:
      tags: [Relatórios]
      summary: Gerar relatório de quantidade de ocorrências
      operationId: gerarRelatorio
      description: |
        Relatório por período, turma ou categoria (RF13, UC05), sobre a
        data/hora do fato no intervalo informado (dias inteiros em São Paulo,
        pontas incluídas). Entram ocorrências de todos os status, e cada
        ocorrência conta uma vez. A contagem também passa pela visibilidade
        (RN19).

        * `periodo`: só o total (`linhas` vazio);
        * `turma`: uma linha por turma **da ocorrência** (RN14);
        * `categoria`: uma linha por categoria.

        Sem linhas com zero; linhas em ordem alfabética natural do rótulo
        (pt-BR, "6º A" antes de "10º A") e, no empate, por id. Não há
        exportação (Seção 5). Sem dados pessoais.

        Perfis: GESTAO, PEDAGOGICO.
      parameters:
        - name: tipo
          in: query
          required: true
          schema:
            type: string
            enum: [periodo, turma, categoria]
        - $ref: '#/components/parameters/DataInicioObrigatoria'
        - $ref: '#/components/parameters/DataFimObrigatoria'
      responses:
        '200':
          description: Relatório gerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relatorio'
              examples:
                porTurma:
                  value:
                    tipo: turma
                    dataInicio: '2026-10-01'
                    dataFim: '2026-10-31'
                    total: 5
                    linhas:
                      - id: 1
                        rotulo: 1º A — Ensino Médio (2026)
                        quantidade: 3
                      - id: 2
                        rotulo: 9º B — Ensino Fundamental II (2026)
                        quantidade: 2
                porPeriodo:
                  value:
                    tipo: periodo
                    dataInicio: '2026-10-01'
                    dataFim: '2026-10-31'
                    total: 5
                    linhas: []
        '400':
          description: Parâmetro ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                tipo:
                  value:
                    erro: 'Informe tipo com um destes valores: periodo, turma, categoria.'
                dataInicio:
                  value:
                    erro: Informe dataInicio no formato AAAA-MM-DD.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT HS256 emitido pelo `POST /auth/login`, válido por 8 horas, sem
        refresh (RNF03). Enviar como `Authorization: Bearer <token>`.

  parameters:
    IdUsuario:
      name: id
      in: path
      required: true
      description: Id do usuário (inteiro positivo; fora do formato responde 400 "Identificador de usuário inválido.").
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    IdTurma:
      name: id
      in: path
      required: true
      description: Id da turma (inteiro positivo; fora do formato responde 400).
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    IdEstudante:
      name: id
      in: path
      required: true
      description: Id do estudante (inteiro positivo; fora do formato responde 400).
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    IdCategoria:
      name: id
      in: path
      required: true
      description: Id da categoria (inteiro positivo; fora do formato responde 400).
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    IdOcorrencia:
      name: id
      in: path
      required: true
      description: Id da ocorrência (inteiro positivo; fora do formato responde 400 "Identificador de ocorrência inválido.").
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    DataInicioOpcional:
      name: dataInicio
      in: query
      required: false
      description: Primeiro dia do período (AAAA-MM-DD, horário de São Paulo, incluído), sobre a data/hora do fato.
      schema:
        type: string
        format: date
      example: '2026-10-01'
    DataFimOpcional:
      name: dataFim
      in: query
      required: false
      description: Último dia do período (AAAA-MM-DD, horário de São Paulo, incluído). Não pode ser anterior a dataInicio.
      schema:
        type: string
        format: date
      example: '2026-10-31'
    DataInicioObrigatoria:
      name: dataInicio
      in: query
      required: true
      description: Primeiro dia do período (AAAA-MM-DD, horário de São Paulo, incluído).
      schema:
        type: string
        format: date
      example: '2026-10-01'
    DataFimObrigatoria:
      name: dataFim
      in: query
      required: true
      description: Último dia do período (AAAA-MM-DD, horário de São Paulo, incluído). Não pode ser anterior a dataInicio.
      schema:
        type: string
        format: date
      example: '2026-10-31'

  headers:
    RetryAfter:
      description: Segundos até a janela de 15 minutos liberar novas tentativas.
      schema:
        type: integer
        minimum: 0
      example: 840
    RateLimit:
      description: Cabeçalho padrão `RateLimit` (draft-7 do IETF), enviado pelo express-rate-limit.
      schema:
        type: string
      example: 'limit=5, remaining=0, reset=840'
    RateLimitPolicy:
      description: Cabeçalho padrão `RateLimit-Policy` (draft-7 do IETF).
      schema:
        type: string
      example: '5;w=900'
    WwwAuthenticate:
      description: Sempre `Bearer` nos 401 das rotas protegidas.
      schema:
        type: string
      example: Bearer

  responses:
    ErroValidacao:
      description: Entrada inválida (corpo, parâmetro de URL ou de consulta), com mensagem clara.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Informe nome (texto não vazio).
    NaoAutenticado:
      description: |
        Token ausente, malformado, inválido ou expirado; usuário inexistente,
        bloqueado ou desativado (RN09); ou token emitido antes da última troca
        de senha (RN12). Mensagem única (RNF06).
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Não autenticado. Faça login novamente.
    Proibido:
      description: |
        Perfil sem permissão para a operação (RN01/RF14; inclusive RN22) ou
        troca de senha obrigatória pendente (RN10). No caso da troca
        pendente (todas as rotas protegidas, exceto `PUT /conta/senha`), a
        resposta traz `codigo: "TROCA_SENHA_OBRIGATORIA"` (Issue #72); o 403
        de perfil sem permissão traz só `erro`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            perfilSemPermissao:
              summary: Perfil sem permissão (sem codigo)
              value:
                erro: Acesso não permitido para o seu perfil.
            trocaSenhaObrigatoria:
              summary: Troca de senha pendente (RN10)
              value:
                erro: Você precisa trocar a sua senha temporária para continuar usando o sistema.
                codigo: TROCA_SENHA_OBRIGATORIA
    OcorrenciaNaoEncontrada:
      description: Ocorrência inexistente ou fora da visibilidade do usuário (RN19) — mesma resposta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Ocorrência não encontrada.
    MuitasTentativas:
      description: |
        Limite de tentativas com falha excedido (5 em 15 minutos — SSD 1.8,
        Seção 12; Issue #90). A mensagem é a mesma para qualquer e-mail. O
        status da conta não muda (RN07).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Muitas tentativas. Tente novamente em alguns minutos.
    ConflitoTurma:
      description: Turma duplicada no mesmo ano letivo (RN18 — `TURMA_DUPLICADA`) ou conflito concorrente (`CONFLITO_CONCORRENTE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            duplicada:
              value:
                erro: Já existe uma turma cadastrada com este nome e esta etapa neste ano letivo.
                codigo: TURMA_DUPLICADA
            concorrente:
              value:
                erro: A turma foi alterada por outra operação ao mesmo tempo. Tente novamente.
                codigo: CONFLITO_CONCORRENTE
    ConflitoEstudante:
      description: Código escolar duplicado (RN18 — `CODIGO_ESCOLAR_DUPLICADO`) ou conflito concorrente (`CONFLITO_CONCORRENTE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            codigoDuplicado:
              value:
                erro: Já existe um estudante cadastrado com este código escolar.
                codigo: CODIGO_ESCOLAR_DUPLICADO
            concorrente:
              value:
                erro: O estudante foi alterado por outra operação ao mesmo tempo. Tente novamente.
                codigo: CONFLITO_CONCORRENTE
    ConflitoCategoria:
      description: Nome de categoria duplicado (RN18 — `CATEGORIA_DUPLICADA`) ou conflito concorrente (`CONFLITO_CONCORRENTE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          examples:
            duplicada:
              value:
                erro: Já existe uma categoria cadastrada com este nome.
                codigo: CATEGORIA_DUPLICADA
            concorrente:
              value:
                erro: A categoria foi alterada por outra operação ao mesmo tempo. Tente novamente.
                codigo: CONFLITO_CONCORRENTE
    DetalheOcorrencia:
      description: |
        Detalhe completo da ocorrência, no formato do `GET /ocorrencias/{id}`
        (`codigoEscolar` dos estudantes só para a Gestão — RN20). Usado
        também como resposta do encaminhamento, da comunicação, da
        providência (201) e do encerramento (200).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OcorrenciaDetalhe'
          example:
            id: 12
            dataHora: '2026-10-20T17:30:00.000Z'
            local: Pátio
            turma:
              id: 1
              nome: 1º A
              etapa: Ensino Médio
              anoLetivo: 2026
            categoria:
              id: 2
              nome: Conflitos
            descricao: Dois estudantes discutiram durante o intervalo; a discussão foi interrompida pelo professor.
            demaisEnvolvidos: null
            testemunhas: Inspetora Fictícia Sete
            providenciasImediatas: Os estudantes foram separados e conversaram com a coordenação.
            observacoes: null
            status: EM_ACOMPANHAMENTO
            dataEncerramento: null
            profissionalResponsavel:
              id: 5
              nome: Professora Fictícia Cinco
            responsavelAcompanhamento:
              id: 3
              nome: Tutora Fictícia Três
            estudantes:
              - id: 10
                nomeCompleto: Aluno Fictício Dez
                turma:
                  id: 1
