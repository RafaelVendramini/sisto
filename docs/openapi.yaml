          $ref: '#/components/schemas/ReferenciaUsuario'
        dataHora:
          allOf:
            - $ref: '#/components/schemas/DataHoraResposta'
          description: Momento do registro, preenchido pelo sistema (RN17).
        observacao:
          type: string
          nullable: true
    Comunicacao:
