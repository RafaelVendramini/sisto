        categoria:
          $ref: '#/components/schemas/CategoriaResumo'
        descricao:
          type: string
        demaisEnvolvidos:
          type: string
          nullable: true
        testemunhas:
          type: string
          nullable: true
        providenciasImediatas:
          type: string
          nullable: true
        observacoes:
          type: string
          nullable: true
        status:
