        - dataHora
        - local
        - turma
        - categoria
        - descricao
        - demaisEnvolvidos
        - testemunhas
        - providenciasImediatas
        - observacoes
        - status
        - dataEncerramento
        - profissionalResponsavel
        - responsavelAcompanhamento
        - estudantes
        - encaminhamentos
      properties:
        id:
          $ref: '#/components/schemas/Id'
        dataHora:
          $ref: '#/components/schemas/DataHoraResposta'
        local:
          type: string
        turma:
          allOf:
            - $ref: '#/components/schemas/Turma'
