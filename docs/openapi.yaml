  /ocorrencias:
    post:
      tags: [Ocorrências]
      summary: Registrar ocorrência com o encaminhamento inicial
      operationId: registrarOcorrencia
      description: |
        Registra a ocorrência (UC01, RF05, RF06) com 1 a 50 estudantes
        distintos (ids repetidos contam uma vez — RN02) e 1 a 10
        encaminhamentos iniciais (RN03). O profissional responsável é sempre o
        usuário logado (RN02). A turma informada é a turma de referência
        (RN14); os estudantes podem ser de outras turmas. A ocorrência nasce
        `ABERTO` e o encaminhamento inicial não muda o status.

        Regras do encaminhamento (RN03): `TUTOR` exige `destinatarioUsuarioId`
        de um usuário Tutor ativo; `EQUIPE_PEDAGOGICA` e `GESTAO` aceitam
        usuário opcional, que, se informado, precisa ter o perfil
        correspondente (`PEDAGOGICO` ou `GESTAO`) e estar ativo.
        Encaminhamentos repetidos (mesmo `destinatarioPerfil` e mesmo
        `destinatarioUsuarioId`, inclusive ambos sem usuário) são recusados
        (400 — Issue #45).

        Ocorrência, estudantes, encaminhamentos, histórico ("ocorrência
        registrada" e um "encaminhamento registrado" por destinatário — RN08)
        e LogAuditoria são gravados numa única transação (tudo ou nada).

        Perfis: todos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcorrenciaEntrada'
            example:
              dataHora: '2026-10-20T14:30:00-03:00'
              local: Pátio
              turmaId: 1
              categoriaId: 2
              descricao: Dois estudantes discutiram durante o intervalo; a discussão foi interrompida pelo professor.
              estudanteIds: [10, 11]
              testemunhas: Inspetora Fictícia Sete
              providenciasImediatas: Os estudantes foram separados e conversaram com a coordenação.
              encaminhamentos:
                - destinatarioPerfil: TUTOR
                  destinatarioUsuarioId: 3
                - destinatarioPerfil: EQUIPE_PEDAGOGICA
                  observacao: Acompanhar a convivência da turma.
      responses:
        '201':
          description: |
            Ocorrência registrada, no formato do detalhe sem `comunicacoes`,
            sem `providencias` e sem `codigoEscolar` dos estudantes (para
            todos os perfis).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcorrenciaRegistrada'
              example:
                id: 12
                dataHora: '2026-10-20T17:30:00.000Z'
                local: Pátio
                turma:
                  id: 1
                  nome: 1º A
                  etapa: Ensino Médio
                  anoLetivo: 2026
                categoria:
                  id: 2
                  nome: Conflitos
                descricao: Dois estudantes discutiram durante o intervalo; a discussão foi interrompida pelo professor.
                demaisEnvolvidos: null
                testemunhas: Inspetora Fictícia Sete
                providenciasImediatas: Os estudantes foram separados e conversaram com a coordenação.
                observacoes: null
                status: ABERTO
                dataEncerramento: null
                profissionalResponsavel:
                  id: 5
                  nome: Professora Fictícia Cinco
                responsavelAcompanhamento: null
                estudantes:
                  - id: 10
                    nomeCompleto: Aluno Fictício Dez
                    turma:
                      id: 1
                      nome: 1º A
                      etapa: Ensino Médio
                      anoLetivo: 2026
                  - id: 11
                    nomeCompleto: Aluna Fictícia Onze
                    turma:
                      id: 2
                      nome: 9º B
                      etapa: Ensino Fundamental II
                      anoLetivo: 2026
                encaminhamentos:
                  - id: 30
                    destinatarioPerfil: TUTOR
                    destinatarioUsuario:
                      id: 3
                      nome: Tutora Fictícia Três
                      perfil: TUTOR
                    registradoPor:
                      id: 5
                      nome: Professora Fictícia Cinco
                    dataHora: '2026-10-20T17:40:00.000Z'
                    observacao: null
                  - id: 31
                    destinatarioPerfil: EQUIPE_PEDAGOGICA
                    destinatarioUsuario: null
                    registradoPor:
                      id: 5
                      nome: Professora Fictícia Cinco
                    dataHora: '2026-10-20T17:40:00.000Z'
                    observacao: Acompanhar a convivência da turma.
        '400':
          description: Dados inválidos, data futura, limites, referência inexistente, destinatário inválido ou encaminhamento repetido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                semEncaminhamento:
                  value:
                    erro: Informe encaminhamentos com ao menos um destinatário (tutor, equipe pedagógica ou gestão).
                dataFutura:
                  value:
                    erro: A data e hora da ocorrência não pode estar no futuro.
                destinatarioInvalido:
                  value:
                    erro: No encaminhamento 1, o usuário destinatário precisa ter perfil Tutor e status ativo.
                repetido:
                  value:
                    erro: Os encaminhamentos 1 e 2 têm o mesmo destinatário. Remova o repetido.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '409':
          description: Conflito concorrente (transação repetida sem sucesso — `CONFLITO_CONCORRENTE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                erro: Não foi possível registrar a ocorrência por causa de outra operação ao mesmo tempo. Tente novamente.
                codigo: CONFLITO_CONCORRENTE
    get:
      tags: [Ocorrências]
      summary: Consultar ocorrências com filtros e paginação
      operationId: listarOcorrencias
      description: |
        Lista **resumida** e paginada (20 itens por página) das ocorrências
        visíveis ao usuário (RN19), da mais recente para a mais antiga
        (data/hora do fato e, no empate, id, decrescentes). Os filtros são
        opcionais, combinados com E lógico e **sempre** limitados pela
        visibilidade: nenhum filtro amplia o que o perfil vê (RF11, UC03).
        Parâmetros desconhecidos são ignorados. Id válido de registro
        inexistente não é erro (só não casa com nada). Página além da última
        devolve `itens` vazio (200).

        Visibilidade (RN19): Gestão e Pedagógico veem todas; Professor e
        Técnico-administrativo, as que registraram e as encaminhadas a eles
        como usuário destinatário; o Tutor, além dessas, as que acompanha como
        responsável e as que envolvem estudantes sob sua tutoria atual.

        Perfis: todos.
      parameters:
        - name: estudanteId
          in: query
          required: false
          description: Ocorrências que envolvem o estudante.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: turmaId
          in: query
          required: false
          description: Turma **da ocorrência** (turma de referência — RN14), não a turma atual do estudante.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: categoriaId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: status
          in: query
          required: false
          description: Valor exato do enum.
          schema:
            $ref: '#/components/schemas/StatusOcorrencia'
        - $ref: '#/components/parameters/DataInicioOpcional'
        - $ref: '#/components/parameters/DataFimOpcional'
        - name: profissionalResponsavelId
          in: query
          required: false
          description: |
            Quem registrou a ocorrência (RN02). Aceito para qualquer perfil,
            sempre dentro da visibilidade; na tela, o filtro aparece só para a
            Gestão.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: pagina
          in: query
          required: false
          description: Número da página, a partir de 1 (padrão 1).
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            default: 1
      responses:
        '200':
          description: Página de ocorrências.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaOcorrencias'
              example:
                itens:
                  - id: 12
                    dataHora: '2026-10-20T17:30:00.000Z'
                    local: Pátio
                    status: EM_ACOMPANHAMENTO
                    turma:
                      id: 1
                      nome: 1º A
                      etapa: Ensino Médio
                      anoLetivo: 2026
                    categoria:
                      id: 2
                      nome: Conflitos
                    profissionalResponsavel:
                      id: 5
                      nome: Professora Fictícia Cinco
                    estudantes:
                      - id: 10
                        nomeCompleto: Aluno Fictício Dez
                      - id: 11
                        nomeCompleto: Aluna Fictícia Onze
                total: 1
                pagina: 1
                tamanhoPagina: 20
        '400':
          description: Parâmetro de consulta inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                status:
                  value:
                    erro: 'O filtro status deve ser um dos valores: ABERTO, EM_ACOMPANHAMENTO, ENCERRADO.'
                periodo:
                  value:
                    erro: A dataInicio não pode ser posterior à dataFim.
                pagina:
                  value:
                    erro: O parâmetro pagina deve ser um número inteiro a partir de 1.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'

  /ocorrencias/{id}:
    get:
      tags: [Ocorrências]
      summary: Consultar o detalhe de uma ocorrência
      operationId: detalharOcorrencia
      description: |
        Todos os campos do registro, profissional responsável, responsável
        pelo acompanhamento, estudantes, categoria, turma, encaminhamentos,
        comunicações e providências adotadas (Issue #47). Comunicações e
        providências vêm da mais antiga para a mais nova. A chave
        `codigoEscolar` dos estudantes só aparece para a Gestão (RN20).
        Ocorrência inexistente ou fora da visibilidade: 404 com a mesma
        mensagem (RN19).

        Perfis: todos (limitados pela RN19).
      parameters:
        - $ref: '#/components/parameters/IdOcorrencia'
      responses:
        '200':
          $ref: '#/components/responses/DetalheOcorrencia'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/OcorrenciaNaoEncontrada'
    put:
      tags: [Ocorrências]
      summary: Reservado — fora do MVP
      operationId: atualizarOcorrencia
      deprecated: true
      description: |
        **Reservado — fora do MVP (SSD 1.8, Seção 12).** A atualização dos
        campos de uma ocorrência não está implementada; a linha é mantida na
        Seção 12 apenas como reservada. Chamadas autenticadas respondem 404
        (`Rota não encontrada`); com troca de senha pendente, o bloqueio da
        RN10 vem antes e a resposta é 403.
      parameters:
        - $ref: '#/components/parameters/IdOcorrencia'
      responses:
